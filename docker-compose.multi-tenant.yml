# Simulates multi-tenancy: 5 independent single-tenant client/server pairs,
# each on its own subdomain, all reporting their (hashed) users to one shared
# tenant-router, which patient-portal calls to resolve logins. Entirely
# separate from docker-compose.yml (this file uses its own Postgres, its own
# ports, its own volume) so both can exist without colliding.
#
# Usage:
#   docker compose -f docker-compose.multi-tenant.yml up --build
#
# Once every tenant-server is up, check tenant-router's directory:
#   docker compose -f docker-compose.multi-tenant.yml exec postgres \
#     psql -U simuser -d tenant_router -c \
#     'SELECT s."Name", count(*) FROM tenant_usernames t
#      JOIN subdomains s ON s."Id" = t."SubdomainId" GROUP BY s."Name"'
#
# patient-portal-client (http://localhost:5591) has the 2-step login flow —
# username first, then password, routed to whichever tenant(s) that username
# was reported under.

x-tenant-server-env: &tenant-server-env
  ASPNETCORE_ENVIRONMENT: Development
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: simuser
  DB_PASSWORD: simpass
  APP_DOMAIN: simulation.local
  TENANT_ROUTER_URL: http://tenant-router:8080
  TENANT_REPORT_SECRET: dev-only-shared-secret-replace-before-deploying
  SEED_RANDOM_USER_COUNT: "15"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simuser
      POSTGRES_PASSWORD: simpass
    ports:
      - "5540:5432"
    volumes:
      - multi_tenant_postgres_data:/var/lib/postgresql/data
      - ./db-init/multi-tenant-init.sql:/docker-entrypoint-initdb.d/multi-tenant-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simuser"]
      interval: 5s
      timeout: 3s
      retries: 10

  tenant-router:
    build:
      context: ./tenant-router
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TENANT_ROUTER_DB_HOST: postgres
      TENANT_ROUTER_DB_PORT: "5432"
      TENANT_ROUTER_DB_NAME: tenant_router
      TENANT_ROUTER_DB_USER: simuser
      TENANT_ROUTER_DB_PASSWORD: simpass
      TENANT_REPORT_SECRET: dev-only-shared-secret-replace-before-deploying
    ports:
      - "5595:8080"
    depends_on:
      postgres:
        condition: service_healthy

  patient-portal-server:
    build:
      context: ./patient-portal/server
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TENANT_ROUTER_URL: http://tenant-router:8080
      TENANT_REPORT_SECRET: dev-only-shared-secret-replace-before-deploying
      CLIENT_ORIGIN: http://localhost:5591
    ports:
      - "5590:8080"
    depends_on:
      tenant-router:
        condition: service_healthy

  patient-portal-client:
    build:
      context: ./patient-portal/client
      args:
        VITE_API_BASE_URL: http://localhost:5590
    ports:
      - "5591:80"
    depends_on:
      - patient-portal-server

  tenant1-server:
    build:
      context: ./single-tenant/server
    restart: unless-stopped
    environment:
      <<: *tenant-server-env
      DB_NAME: tenant1
      SUBDOMAIN: tenant1
      SELF_URL: http://tenant1-server:8080
      CLIENT_ORIGIN: http://localhost:5401
    ports:
      - "5301:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tenant-router:
        condition: service_healthy

  tenant1-client:
    build:
      context: ./single-tenant/client
      args:
        VITE_API_BASE_URL: http://localhost:5301
    ports:
      - "5401:80"
    depends_on:
      - tenant1-server

  tenant2-server:
    build:
      context: ./single-tenant/server
    restart: unless-stopped
    environment:
      <<: *tenant-server-env
      DB_NAME: tenant2
      SUBDOMAIN: tenant2
      SELF_URL: http://tenant2-server:8080
      CLIENT_ORIGIN: http://localhost:5402
    ports:
      - "5302:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tenant-router:
        condition: service_healthy

  tenant2-client:
    build:
      context: ./single-tenant/client
      args:
        VITE_API_BASE_URL: http://localhost:5302
    ports:
      - "5402:80"
    depends_on:
      - tenant2-server

  tenant3-server:
    build:
      context: ./single-tenant/server
    restart: unless-stopped
    environment:
      <<: *tenant-server-env
      DB_NAME: tenant3
      SUBDOMAIN: tenant3
      SELF_URL: http://tenant3-server:8080
      CLIENT_ORIGIN: http://localhost:5403
    ports:
      - "5303:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tenant-router:
        condition: service_healthy

  tenant3-client:
    build:
      context: ./single-tenant/client
      args:
        VITE_API_BASE_URL: http://localhost:5303
    ports:
      - "5403:80"
    depends_on:
      - tenant3-server

  tenant4-server:
    build:
      context: ./single-tenant/server
    restart: unless-stopped
    environment:
      <<: *tenant-server-env
      DB_NAME: tenant4
      SUBDOMAIN: tenant4
      SELF_URL: http://tenant4-server:8080
      CLIENT_ORIGIN: http://localhost:5404
    ports:
      - "5304:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tenant-router:
        condition: service_healthy

  tenant4-client:
    build:
      context: ./single-tenant/client
      args:
        VITE_API_BASE_URL: http://localhost:5304
    ports:
      - "5404:80"
    depends_on:
      - tenant4-server

  tenant5-server:
    build:
      context: ./single-tenant/server
    restart: unless-stopped
    environment:
      <<: *tenant-server-env
      DB_NAME: tenant5
      SUBDOMAIN: tenant5
      SELF_URL: http://tenant5-server:8080
      CLIENT_ORIGIN: http://localhost:5405
    ports:
      - "5305:8080"
    depends_on:
      postgres:
        condition: service_healthy
      tenant-router:
        condition: service_healthy

  tenant5-client:
    build:
      context: ./single-tenant/client
      args:
        VITE_API_BASE_URL: http://localhost:5305
    ports:
      - "5405:80"
    depends_on:
      - tenant5-server

volumes:
  multi_tenant_postgres_data:
