services:
  single_tenant_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-brydon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-brydon}
      POSTGRES_DB: ${DB_NAME:-brydon}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - single_tenant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-brydon} -d ${DB_NAME:-brydon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # patient-portal/server has no database of its own — the tenant directory
  # (subdomains + hashed usernames) lives in tenant-router instead.
  tenant_router_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TENANT_ROUTER_DB_USER:-tenant_router}
      POSTGRES_PASSWORD: ${TENANT_ROUTER_DB_PASSWORD:-tenant_router}
      POSTGRES_DB: ${TENANT_ROUTER_DB_NAME:-tenant_router}
    ports:
      - "${TENANT_ROUTER_DB_PORT:-5435}:5432"
    volumes:
      - tenant_router_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TENANT_ROUTER_DB_USER:-tenant_router} -d ${TENANT_ROUTER_DB_NAME:-tenant_router}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  single_tenant_postgres_data:
  tenant_router_postgres_data:
